# Скопируй в config.yaml и поправь под себя.

# --- Локальная нейросеть -------------------------------------------------
# ollama  — Ollama (https://ollama.com), адрес по умолчанию http://localhost:11434
# openai  — любой OpenAI-совместимый сервер: LM Studio (http://localhost:1234),
#           llama.cpp llama-server (http://localhost:8080), koboldcpp и т.п.
llm_backend: ollama
llm_url: http://localhost:11434
llm_api_key: ""

# Основная модель — должна уметь вызывать инструменты (tools).
# Хорошо работают: llama3.1:8b, qwen2.5:7b (лучше понимает русский), qwen2.5:14b, mistral-nemo.
# Для LM Studio пиши имя модели так, как оно показано в LM Studio.
model: llama3.1:8b

# Модель-«глаза» для просмотра экрана. Пусто — помощник не будет смотреть на экран и кликать.
# Варианты: llama3.2-vision, qwen2.5vl:7b, gemma3:12b, minicpm-v.
vision_model: llama3.2-vision

# Размер контекста в токенах (только для Ollama). Меньше 8192 не ставь — не влезут инструменты.
num_ctx: 8192
temperature: 0.3
# Сколько держать модель в видеопамяти после запроса (Ollama).
keep_alive: 30m
# Сколько секунд ждать ответа нейросети.
llm_timeout: 180

# Говорить с матом, по-пацански (true/false).
swearing: true

# Имя, на которое откликается помощник (все варианты, как его может услышать распознавалка).
wake_words: [джарвис, джарвиз, жарвис, джервис, джарвес, ярвис]
assistant_name: Джарвис
user_name: сэр

# Папка с моделью Vosk (scripts/download_model.py скачает её сам).
vosk_model: models/vosk-model-small-ru-0.22
# --- Режим «Слушай» ------------------------------------------------------
# Скажи «слушай» — и дальше каждая фраза команда, без «Джарвис». «Стоп» — снова ждёт имя.
listen_on_phrases: [слушай, слушай меня, слушай постоянно, будь на связи]
listen_off_phrases: [стоп, хватит, хватит слушать, не слушай, перестань слушать, отбой]
# Через сколько минут тишины самому выйти из режима «слушай» (0 — никогда).
always_listen_minutes: 0
# Слушать без имени сразу после запуска.
start_listening: false

# --- Перебить --------------------------------------------------------------
# Пока Джарвис говорит или думает, скажи одно из этих слов — он замолчит и бросит задачу.
# Пусто [] — выключить. Если он перебивает сам себя своим голосом из колонок — подними
# interrupt_confidence до 0.95 или говори в наушниках.
interrupt_words: [стоп, хватит, заткнись, замолчи, отмена, джарвис]
interrupt_confidence: 0.9

# Распознавание команд: whisper — нейросеть Whisper, понимает речь заметно лучше (нужен
# pip install faster-whisper), vosk — только лёгкий Vosk. Имя «Джарвис» всегда ловит Vosk.
stt_engine: whisper
# small — быстро и мало памяти (~0.5 ГБ); medium — точнее; large-v3-turbo — лучшее качество (~1.6 ГБ).
whisper_model: small
# cpu — на процессоре: ~1 с на команду и не отнимает видеопамять у игры и нейросети.
# cuda — на видеокарте, быстрее (нужны библиотеки CUDA; не заведётся — сам вернётся на cpu).
whisper_device: cpu
# int8 для cpu, int8_float16 для cuda.
whisper_compute: int8

# Номер микрофона (python -m jarvis --list-mics), null = по умолчанию.
mic_device: null
# Сколько секунд после ответа слушать продолжение без повторного "Джарвис".
follow_up_seconds: 6

# Голос: edge (нейросетевой, нужен интернет) или sapi (системный, оффлайн).
tts_engine: edge
edge_voice: ru-RU-DmitryNeural
tts_rate: 0          # для edge: проценты (-50..50); для sapi: слова в минуту (0 = по умолчанию)

# Спрашивать голосом подтверждение перед опасными действиями
# (команды в консоли, убийство процессов, выключение ПК).
confirm_dangerous: true
# Спрашивать «да/нет» перед выключением, перезагрузкой и сном. false — выключает сразу по команде.
confirm_power: true

# Через сколько минут простоя забывать контекст разговора.
idle_reset_minutes: 10

# Самообучение: после каждого разговора помощник разбирает его и дописывает
# в память (папка memory/) то, что узнал о тебе. Это один доп. запрос к нейросети на разговор.
# Сам он запоминает и во время разговора — когда ты просишь или поправляешь его.
learning: true

# Простые команды («открой телеграм», «громче», «пауза», «следующий трек», «сверни всё»)
# выполняются сразу, без нейросети — быстрее и надёжнее на слабых моделях.
quick_commands: true

# Не давать модели «размышлять» перед ответом (Qwen3/3.5 и т.п.) — отвечает в разы быстрее.
disable_thinking: true

# --- Игровой режим («Джарвис, игровой режим» / «обычный режим») -------------
# Отвечает коротко, сам не смотрит на экран и не жмёт клавиши, не автоматизирует игру.
game_name: Русская Рыбалка 4
# Лёгкая модель на время игры, чтобы освободить видеопамять. Пусто — та же, что обычно.
game_model: ""
game_vision_model: ""

# --- Поиск точек РР4 («Джарвис, вьюнок перловица») --------------------------
# Публичные Telegram-каналы с точками, в которых искать (имя после t.me/), например [kanal1, kanal2].
fishing_tg_channels: []
# Где открывать посты из Telegram: web — веб-версия web.telegram.org, app — приложение, browser — t.me.
tg_open_mode: web

# Discord-каналы с точками. Читаются через твоего бота (как его сделать — в README).
# Токен бота можно не писать сюда, а задать переменную окружения DISCORD_BOT_TOKEN.
discord_bot_token: ""
# ID каналов (ПКМ по каналу → «Копировать ID») или ссылки на них.
discord_channels: []
# Где открывать сообщения: web — в браузере (discord.com), app — в приложении Discord.
discord_open_mode: web
