# Скопируй в config.yaml и поправь под себя.

# Ключ Claude API. Можно не писать сюда, а задать переменную окружения ANTHROPIC_API_KEY.
api_key: ""
model: claude-opus-5-5
# low / medium / high — чем выше, тем умнее, но дольше думает.
effort: medium

# Имя, на которое откликается помощник (все варианты, как его может услышать распознавалка).
wake_words: [джарвис, джарвиз, жарвис, джервис, джарвес, ярвис]
assistant_name: Джарвис
user_name: сэр

# Папка с моделью Vosk (scripts/download_model.py скачает её сам).
vosk_model: models/vosk-model-small-ru-0.22
# Номер микрофона (python -m jarvis --list-mics), null = по умолчанию.
mic_device: null
# Сколько секунд после ответа слушать продолжение без повторного "Джарвис".
follow_up_seconds: 6

# Голос: edge (нейросетевой, нужен интернет) или sapi (системный, оффлайн).
tts_engine: edge
edge_voice: ru-RU-DmitryNeural
tts_rate: 0          # для edge: проценты (-50..50); для sapi: слова в минуту (0 = по умолчанию)

# Спрашивать голосом подтверждение перед опасными действиями
# (команды в консоли, убийство процессов, выключение ПК).
confirm_dangerous: true

# Через сколько минут простоя забывать контекст разговора.
idle_reset_minutes: 10

# Самообучение: после каждого разговора помощник разбирает его и дописывает
# в память (папка memory/) то, что узнал о тебе. Стоит один доп. запрос к API на разговор.
# Сам он запоминает и во время разговора — когда ты просишь или поправляешь его.
learning: true
